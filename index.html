<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多感官幼兒英文單字學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background-color: #f0f9ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 480px;
    }

    /* 上方提示區域 */
    .image-container {
      font-size: 100px;
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 20px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .image-container:active {
      transform: scale(0.95);
    }
    .hint-text {
      color: #868e96;
      font-size: 14px;
      margin-top: 6px;
    }

    /* 下方答案槽（Slots） */
    .answer-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 30px 0;
      min-height: 64px;
    }
    
    /* 多感官 1：視覺虛線與透明度 */
    .slot {
      width: 56px;
      height: 64px;
      border-bottom: 4px solid #4dabf7;
      font-size: 36px;
      font-weight: bold;
      color: rgba(25, 113, 194, 0.25); /* 預設半透明，作為視覺形狀輔助 */
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s;
    }
    .slot.filled {
      color: #1971c2; /* 填充答案後變深色 */
      background-color: #e7f5ff;
    }

    /* 答錯搖擺動畫（觸覺/視覺反饋） */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    /* 字母選單 */
    .letters-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .letter-btn {
      width: 56px;
      height: 56px;
      background-color: #ff8787;
      color: white;
      font-size: 32px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      box-shadow: 0 6px 0 #e03131;
      cursor: pointer;
      transition: all 0.1s;
    }
    .letter-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #e03131;
    }
    .letter-btn.disabled {
      visibility: hidden;
    }

    /* 下一題按鈕 */
    .next-btn {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 20px;
      font-weight: bold;
      background-color: #51cf66;
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 0 #2b8a3e;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="image-container" id="imageDisplay" onclick="speakCurrentWord()">🐱</div>
    <div class="hint-text">點擊圖片聽發音</div>

    <div class="answer-container" id="answerSlots"></div>

    <div class="letters-container" id="letterPool"></div>

    <button class="next-btn" id="nextBtn" onclick="loadNextQuestion()">下一題 ➔</button>
  </div>

  <script>
    const questions = [
      { word: "CAT", icon: "🐱" },
      { word: "DOG", icon: "🐶" },
      { word: "SUN", icon: "☀️" },
      { word: "BUS", icon: "🚌" },
      { word: "APPLE", icon: "🍎" }
    ];

    let currentIndex = 0;
    let currentAnswer = [];

    // 初始化題目
    function initQuestion() {
      const q = questions[currentIndex];
      document.getElementById('imageDisplay').textContent = q.icon;
      document.getElementById('nextBtn').style.display = 'none';
      currentAnswer = [];

      speakCurrentWord();

      // 多感官 1：生成帶有半透明視覺提示字母（Trace Mode）的答案槽
      const slotsContainer = document.getElementById('answerSlots');
      slotsContainer.innerHTML = '';
      slotsContainer.classList.remove('shake');
      
      for (let i = 0; i < q.word.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.textContent = q.word[i]; // 半透明字母預覽
        slotsContainer.appendChild(slot);
      }

      // 生成字母塊
      const letters = q.word.split('');
      if (letters.length <= 3) {
        letters.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
      }
      letters.sort(() => Math.random() - 0.5);

      const poolContainer = document.getElementById('letterPool');
      poolContainer.innerHTML = '';
      letters.forEach((char) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = char;
        btn.onclick = () => selectLetter(btn, char);
        poolContainer.appendChild(btn);
      });
    }

    // 點擊字母處理
    function selectLetter(btn, char) {
      const targetWord = questions[currentIndex].word;
      if (currentAnswer.length < targetWord.length) {
        currentAnswer.push(char);
        btn.classList.add('disabled');
        
        // 觸覺反饋：行動裝置輕微震動
        triggerHaptic(15);

        // 聽覺反饋：語音發音
        speakText(char);

        // 更新 UI 答案槽狀態
        const slots = document.querySelectorAll('.slot');
        const activeSlot = slots[currentAnswer.length - 1];
        activeSlot.textContent = char;
        activeSlot.classList.add('filled');

        if (currentAnswer.length === targetWord.length) {
          checkAnswer();
        }
      }
    }

    // 檢查答案
    function checkAnswer() {
      const userWord = currentAnswer.join('');
      const targetWord = questions[currentIndex].word;
      const slotsContainer = document.getElementById('answerSlots');

      if (userWord === targetWord) {
        // 答對：播放高音勵志音效 + 震動 + 語音讚賞
        playTone(523.25, 0.15); // C5 音符
        setTimeout(() => playTone(659.25, 0.25), 150); // E5 音符
        triggerHaptic([30, 50, 30]);

        setTimeout(() => {
          speakText("Great job! " + targetWord);
          document.getElementById('nextBtn').style.display = 'inline-block';
        }, 300);
      } else {
        // 答錯：低音提示音 + 搖擺動畫 + 觸覺提示
        playTone(196.00, 0.3); // G3 低音
        slotsContainer.classList.add('shake');
        triggerHaptic([100, 50, 100]);

        setTimeout(() => {
          speakText("Try again!");
          resetCurrentQuestion();
        }, 600);
      }
    }

    // 重置槽位
    function resetCurrentQuestion() {
      const targetWord = questions[currentIndex].word;
      currentAnswer = [];
      const slotsContainer = document.getElementById('answerSlots');
      slotsContainer.classList.remove('shake');

      document.querySelectorAll('.slot').forEach((s, i) => {
        s.textContent = targetWord[i];
        s.classList.remove('filled');
      });
      document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('disabled'));
    }

    function loadNextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      initQuestion();
    }

    // 多感官 2：Web Audio API 合成音效生成器（不需要載入外部音訊檔）
    function playTone(freq, duration) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.log("Audio not supported");
      }
    }

    // 多感官 3：Vibration API 觸覺反饋
    function triggerHaptic(pattern) {
      if ('vibrate' in navigator) {
        navigator.vibrate(pattern);
      }
    }

    // 語音發音
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    function speakCurrentWord() {
      speakText(questions[currentIndex].word);
    }

    window.onload = initQuestion;
  </script>
</body>
</html>
