<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幼兒英文單字多感官學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 520px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    /* 答對彈出標籤 */
    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 32px;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
    }

    /* 頂部吉祥物與計分板 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    .mascot {
      font-size: 36px;
      cursor: pointer;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    /* 提示模式選擇器 */
    .hint-selector-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .hint-selector-box label {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .hint-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .hint-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hint-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    /* 主選單：難度按鈕 */
    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .level-btn:active { transform: scale(0.98); }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    /* 頂部控制欄 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .progress-text {
      font-size: 16px;
      font-weight: bold;
      color: #495057;
    }

    /* 上方提示圖片 */
    .image-container {
      font-size: 95px;
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .image-container:active { transform: scale(0.95); }
    .hint-text {
      color: #868e96;
      font-size: 13px;
      margin-top: 4px;
    }

    /* 答案槽 (Slots) */
    .answer-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .slot {
      width: 48px;
      height: 56px;
      border-bottom: 4px solid #4dabf7;
      font-size: 32px;
      font-weight: bold;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 10px 10px 0 0;
      transition: all 0.2s;
    }
    .slot.show-trace {
      color: rgba(25, 113, 194, 0.25);
    }
    .slot.filled {
      color: #1971c2 !important;
      background-color: #e7f5ff;
    }

    /* 答錯搖擺動畫 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    /* 繽紛字母按鈕 */
    .letters-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .letter-btn {
      width: 52px;
      height: 52px;
      color: white;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .letter-btn:nth-child(5n+1) { background-color: #ff6b6b; box-shadow: 0 5px 0 #c92a2a; }
    .letter-btn:nth-child(5n+2) { background-color: #4c6ef5; box-shadow: 0 5px 0 #364fc7; }
    .letter-btn:nth-child(5n+3) { background-color: #51cf66; box-shadow: 0 5px 0 #2b8a3e; }
    .letter-btn:nth-child(5n+4) { background-color: #fcc419; box-shadow: 0 5px 0 #e67700; color: #333; }
    .letter-btn:nth-child(5n+5) { background-color: #cc5de8; box-shadow: 0 5px 0 #862e9c; }

    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.2) !important;
    }
    .letter-btn.disabled { visibility: hidden; }

    .next-btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div id="correctBadge" class="correct-badge">Super Star! 🌟</div>

    <div class="header-bar">
      <div class="mascot" id="mascotIcon" onclick="speakText('I love learning english with you!')">🐻</div>
      <div id="mascotBubble" style="font-size: 14px; font-weight: bold; color: #495057;">加油喔！</div>
      <div class="score-board">⭐ <span id="starScore">0</span></div>
    </div>

    <!-- 主選單 -->
    <div id="menuScreen">
      <h2>請選擇學習關卡 🎯</h2>

      <div class="hint-selector-box">
        <label>💡 請選擇提示輔助模式：</label>
        <div class="hint-options">
          <button class="hint-btn active" onclick="setHintMode('trace', this)">🔤 全字母虛線</button>
          <button class="hint-btn" onclick="setHintMode('partial', this)">🧩 部分字母虛線</button>
          <button class="hint-btn" onclick="setHintMode('audio', this)">🔊 純語音提示</button>
          <button class="hint-btn" onclick="setHintMode('none', this)">🎯 無提示挑戰</button>
        </div>
      </div>

      <div class="level-menu">
        <button class="level-btn lvl-1" onclick="startLevel(1)">Level 1: 幼兒入門 (3字母) <span>50題</span></button>
        <button class="level-btn lvl-2" onclick="startLevel(2)">Level 2: 基礎進階 (4字母) <span>55題</span></button>
        <button class="level-btn lvl-3" onclick="startLevel(3)">Level 3: 中級探索 (5字母) <span>50題</span></button>
        <button class="level-btn lvl-4" onclick="startLevel(4)">Level 4: 高級挑戰 (6+字母) <span>50題</span></button>
        <button class="level-btn lvl-5" onclick="startLevel(5)">Level 5: 英語小達人 (綜合) <span>50題</span></button>
      </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" onclick="showMenu()">➔ 返回選單</button>
        <span class="progress-text" id="progressText">第 1 / 50 題</span>
      </div>

      <div class="image-container" id="imageDisplay" onclick="speakCurrentWord()">🐱</div>
      <div class="hint-text">點擊圖片聽正確發音</div>

      <div class="answer-container" id="answerSlots"></div>
      <div class="letters-container" id="letterPool"></div>

      <button class="next-btn" id="nextBtn" onclick="loadNextQuestion()">下一題 ➔</button>
    </div>
  </div>
