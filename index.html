<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS 專用全螢幕無邊框 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英式英文遊戲">
  
  <title>幼兒英式英文單字學習遊戲</title>
  <!-- 引入輕量級 Confetti 彩帶特效庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
      transition: background 0.8s ease;
    }

    /* 各關卡背景主題色 */
    body.bg-lvl-1 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
    body.bg-lvl-2 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    body.bg-lvl-3 { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
    body.bg-lvl-4 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
    body.bg-lvl-5 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 600px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    @media all and (display-mode: standalone) {
      .game-card {
        max-width: 100%;
        border-radius: 32px;
      }
    }

    .mute-notice {
      background: #fff0f6;
      border: 1px solid #ffdeeb;
      color: #c2255c;
      font-size: 12px;
      font-weight: bold;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 28px;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      z-index: 100;
      cursor: pointer;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
      pointer-events: auto;
    }
    .correct-badge:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
    .correct-badge-sub {
      font-size: 14px;
      display: block;
      margin-top: 4px;
      opacity: 0.9;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    
    .mascot {
      font-size: 36px;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s;
    }
    .mascot.bounce {
      animation: mascotBounce 0.5s ease;
    }
    @keyframes mascotBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.2); }
    }

    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    .mode-selector-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .mode-selector-box label {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .mode-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      padding: 12px 6px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mode-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      touch-action: manipulation;
    }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tool-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      border: 2px solid;
    }
    .speed-btn {
      background-color: #fff3bf;
      color: #d9480f;
      border-color: #ffd43b;
    }

    .progress-text {
      font-size: 15px;
      font-weight: bold;
      color: #495057;
    }

    .image-container {
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 12px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .image-container:active {
      transform: scale(0.98);
    }
    .image-icon {
      font-size: 85px;
      line-height: 1;
    }
    .chinese-hint {
      font-size: 22px;
      font-weight: bold;
      color: #d9480f;
      margin-top: 4px;
    }
    .hint-text {
      color: #868e96;
      font-size: 13px;
      margin-top: 4px;
    }

    .answer-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .slot {
      width: 42px;
      height: 52px;
      border-bottom: 4px solid #4dabf7;
      font-size: 28px;
      font-weight: bold;
      color: rgba(25, 113, 194, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot.filled {
      color: #1971c2 !important;
      background-color: #e7f5ff;
      border-bottom-color: #1971c2;
    }

    .letters-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .letter-btn {
      width: 48px;
      height: 48px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
    }
    .letter-btn:active {
      transform: translateY(3px);
    }
    .letter-btn:nth-child(5n+1) { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .letter-btn:nth-child(5n+2) { background-color: #4c6ef5; box-shadow: 0 4px 0 #364fc7; }
    .letter-btn:nth-child(5n+3) { background-color: #51cf66; box-shadow: 0 4px 0 #2b8a3e; }
    .letter-btn:nth-child(5n+4) { background-color: #fcc419; box-shadow: 0 4px 0 #e67700; color: #333; }
    .letter-btn:nth-child(5n+5) { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .letter-btn.disabled { visibility: hidden; }

    .word-options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0;
    }
    .word-option-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .word-option-btn {
      flex: 1;
      padding: 14px 16px;
      font-size: 22px;
      font-weight: bold;
      color: #1c7ed6;
      background-color: #e7f5ff;
      border: 3px solid #74c0fc;
      border-radius: 16px;
      box-shadow: 0 4px 0 #4dabf7;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
      transition: transform 0.1s;
    }
    .word-option-btn:active {
      transform: translateY(2px);
    }
    .word-option-btn.correct {
      background-color: #d3f9d8 !important;
      border-color: #40c057 !important;
      color: #2b8a3e !important;
      box-shadow: 0 4px 0 #2b8a3e !important;
    }
    .word-option-btn.wrong {
      background-color: #ffe3e3 !important;
      border-color: #ff6b6b !important;
      color: #c92a2a !important;
      box-shadow: 0 4px 0 #c92a2a !important;
    }

    .audio-btn {
      width: 52px;
      height: 52px;
      font-size: 22px;
      background-color: #fff3bf;
      border: 3px solid #fcc419;
      border-radius: 16px;
      box-shadow: 0 4px 0 #fab005;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #fab005;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    .next-btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      display: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="mute-notice">🇬🇧 英式發音模式 ｜ 🔔 若無聲請關閉靜音模式</div>
    
    <div id="correctBadge" class="correct-badge">
      Super Star! 🌟
      <span class="correct-badge-sub">點擊繼續 ➔</span>
    </div>

    <div class="header-bar">
      <div class="mascot" id="mascotBtn">🐻</div>
      <div id="mascotBubble" style="font-size: 14px; font-weight: bold; color: #495057;">點擊開啟聲音！</div>
      <div class="score-board">⭐ <span id="starScore">0</span></div>
    </div>

    <!-- 主選單 -->
    <div id="menuScreen">
      <h2>請選擇學習關卡 🇬🇧🎯</h2>

      <div class="mode-selector-box">
        <label>🎮 請選擇遊戲玩法：</label>
        <div class="mode-options">
          <button class="mode-btn active" data-mode="spelling">🔤 字母拼字模式</button>
          <button class="mode-btn" data-mode="choice">🧩 看圖選單字模式</button>
        </div>
      </div>

      <div class="level-menu">
        <button class="level-btn lvl-1" data-lvl="1">Level 1: 啟蒙 (2-3歲 核心認知) <span>25題</span></button>
        <button class="level-btn lvl-2" data-lvl="2">Level 2: 幼兒 (3-4歲 日常生活) <span>25題</span></button>
        <button class="level-btn lvl-3" data-lvl="3">Level 3: 幼高 (4-5歲 學校與社區) <span>25題</span></button>
        <button class="level-btn lvl-4" data-lvl="4">Level 4: 小一 (5-6歲 探索與自然) <span>25題</span></button>
        <button class="level-btn lvl-5" data-lvl="5">Level 5: 小二 (6-7歲 知識達人) <span>25題</span></button>
      </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" id="backBtn">➔ 返回選單</button>
        <button class="tool-btn speed-btn" id="speedToggleBtn">語速: 🐇 正常</button>
        <span class="progress-text" id="progressText">第 1 / 25 題</span>
      </div>

      <div class="image-container" id="imageDisplay">
        <div class="image-icon" id="imageIcon">🐱</div>
        <div class="chinese-hint" id="chineseHint">貓咪</div>
      </div>
      <div class="hint-text" id="instructionText">點擊圖片聽英式發音</div>

      <!-- 模式一：拼字區域 -->
      <div id="spellingArea" style="display: none;">
        <div class="answer-container" id="answerSlots"></div>
        <div class="letters-container" id="letterPool"></div>
      </div>

      <!-- 模式二：選擇單字區域 -->
      <div id="choiceArea" style="display: none;">
        <div class="word-options-container" id="wordOptions"></div>
      </div>

      <button class="next-btn" id="nextBtn">下一題 ➔</button>
    </div>
  </div>

  <script>
    // 依據英式幼兒發展階段 (UK EYFS & Primary National Curriculum) 重新精編單字庫
    var levelData = {
      // Level 1: 2-3歲 (Early Years Foundation Stage - 核心認知：身體、家庭、色彩、基本動物)
      1: [
        {word:"CAT",icon:"🐱",zh:"貓咪"},{word:"DOG",icon:"🐶",zh:"小狗"},{word:"MUM",icon:"👩",zh:"媽媽"},{word:"DAD",icon:"👨",zh:"爸爸"},
        {word:"BABY",icon:"👶",zh:"BB"},{word:"EYE",icon:"👁️",zh:"眼睛"},{word:"EAR",icon:"👂",zh:"耳朵"},{word:"NOSE",icon:"👃",zh:"鼻子"},
        {word:"HAND",icon:"✋",zh:"手掌"},{word:"FOOT",icon:"🦶",zh:"腳掌"},{word:"RED",icon:"🔴",zh:"紅色"},{word:"BLUE",icon:"🔵",zh:"藍色"},
        {word:"SUN",icon:"☀️",zh:"太陽"},{word:"MOON",icon:"🌙",zh:"月亮"},{word:"STAR",icon:"⭐",zh:"星星"},{word:"MILK",icon:"🥛",zh:"牛奶"},
        {word:"WATER",icon:"💧",zh:"清水"},{word:"DUCK",icon:"🦆",zh:"鴨子"},{word:"BIRD",icon:"🐦",zh:"小鳥"},{word:"FISH",icon:"🐟",zh:"小魚"},
        {word:"PIG",icon:"🐷",zh:"小豬"},{word:"COW",icon:"🐮",zh:"乳牛"},{word:"BOY",icon:"👦",zh:"男孩"},{word:"GIRL",icon:"👧",zh:"女孩"},
        {word:"BALL",icon:"⚽",zh:"皮球"}
      ],

      // Level 2: 3-4歲 (Nursery / K1-K2 - 日常食物、衣物、玩具、家居用品)
      2: [
        {word:"APPLE",icon:"🍎",zh:"蘋果"},{word:"BANANA",icon:"🍌",zh:"香蕉"},{word:"BISCUIT",icon:"🍪",zh:"餅乾"},{word:"SWEETS",icon:"🍬",zh:"糖果"},
        {word:"BREAD",icon:"🍞",zh:"麵包"},{word:"CHEESE",icon:"🧀",zh:"芝士"},{word:"WATER",icon:"💧",zh:"飲用水"},{word:"JUMPER",icon:"🧥",zh:"毛衣外套"},
        {word:"SHOES",icon:"👞",zh:"鞋子"},{word:"SOCKS",icon:"🧦",zh:"襪子"},{word:"HAT",icon:"🧢",zh:"帽子"},{word:"BED",icon:"🛏️",zh:"睡床"},
        {word:"CHAIR",icon:"🪑",zh:"椅子"},{word:"TABLE",icon:"🪵",zh:"桌子"},{word:"DOOR",icon:"🚪",zh:"大門"},{word:"BOOK",icon:"📖",zh:"書本"},
        {word:"TOY",icon:"🧸",zh:"玩具"},{word:"DOLL",icon:"🧸",zh:"公仔"},{word:"CAR",icon:"🚗",zh:"汽車"},{word:"BUS",icon:"🚌",zh:"巴士"},
        {word:"TREE",icon:"🌳",zh:"大樹"},{word:"FLOWER",icon:"🌸",zh:"鮮花"},{word:"RAIN",icon:"🌧️",zh:"下雨"},{word:"HOUSE",icon:"🏠",zh:"房屋"},
        {word:"PARK",icon:"🏞️",zh:"公園"}
      ],

      // Level 3: 4-5歲 (Reception / K3 - 學校生活、社區職業、交通工具、常見大自然)
      3: [
        {word:"SCHOOL",icon:"🏫",zh:"學校"},{word:"TEACHER",icon:"🧑‍🏫",zh:"老師"},{word:"PENCIL",icon:"✏️",zh:"鉛筆"},{word:"PAPER",icon:"📄",zh:"紙張"},
        {word:"RULER",icon:"📏",zh:"直尺"},{word:"FRIEND",icon:"🧑‍🤝‍🧑",zh:"朋友"},{word:"DOCTOR",icon:"🧑‍⚕️",zh:"醫生"},{word:"NURSE",icon:"🧑‍⚕️",zh:"護士"},
        {word:"POLICE",icon:"👮",zh:"警察"},{word:"LORRY",icon:"🚛",zh:"貨車"},{word:"TRAIN",icon:"🚆",zh:"火車"},{word:"PLANE",icon:"✈️",zh:"飛機"},
        {word:"TRAM",icon:"🚊",zh:"電車"},{word:"SHOP",icon:"🏪",zh:"商店"},{word:"MARKET",icon:"🛒",zh:"街市"},{word:"GARDEN",icon:"🏡",zh:"花園"},
        {word:"RIVER",icon:"🏞️",zh:"河流"},{word:"BEACH",icon:"🏖️",zh:"沙灘"},{word:"CLOUD",icon:"☁️",zh:"白雲"},{word:"WIND",icon:"🌬️",zh:"大風"},
        {word:"SNOW",icon:"❄️",zh:"下雪"},{word:"RABBIT",icon:"🐰",zh:"兔子"},{word:"MONKEY",icon:"🐒",zh:"猴子"},{word:"TIGER",icon:"🐯",zh:"老虎"},
        {word:"LION",icon:"🦁",zh:"獅子"}
      ],

      // Level 4: 5-6歲 (Year 1 - 動作習慣、情感表達、動物世界與自然氣候)
      4: [
        {word:"HAPPY",icon:"😊",zh:"快樂"},{word:"SMILE",icon:"😄",zh:"微笑"},{word:"WALK",icon:"🚶",zh:"步行"},{word:"RUNNING",icon:"🏃",zh:"跑步"},
        {word:"JUMPING",icon:"🤸",zh:"跳躍"},{word:"SINGING",icon:"🎤",zh:"唱歌"},{word:"DANCING",icon:"💃",zh:"跳舞"},{word:"SLEEP",icon:"😴",zh:"睡覺"},
        {word:"CLEAN",icon:"🧹",zh:"清潔"},{word:"WASH",icon:"🧼",zh:"洗手"},{word:"ELEPHANT",icon:"🐘",zh:"大象"},{word:"GIRAFFE",icon:"🦒",zh:"長頸鹿"},
        {word:"PANDA",icon:"🐼",zh:"熊貓"},{word:"PENGUIN",icon:"🐧",zh:"企鵝"},{word:"DOLPHIN",icon:"🐬",zh:"海豚"},{word:"RAINBOW",icon:"🌈",zh:"彩虹"},{word:"FOREST",icon:"🌲",zh:"森林"},{word:"MOUNTAIN",icon:"⛰️",zh:"高山"},{word:"ISLAND",icon:"🏝️",zh:"海島"},{word:"WEATHER",icon:"🌤️",zh:"天氣"},{word:"SPRING",icon:"🌸",zh:"春天"},{word:"SUMMER",icon:"🏖️",zh:"夏天"},{word:"AUTUMN",icon:"🍂",zh:"秋天"},{word:"WINTER",icon:"❄️",zh:"冬天"},{word:"HOLIDAY",icon:"🧳",zh:"假期"}
      ],

      // Level 5: 6-7歲 (Year 2 - 知識探險：科學、太空、歷史藝術與世界常識)
      5: [
        {word:"EARTH",icon:"🌍",zh:"地球"},{word:"PLANET",icon:"🪐",zh:"行星"},{word:"ROCKET",icon:"🚀",zh:"火箭"},{word:"ASTRONAUT",icon:"🧑‍🚀",zh:"宇航員"},
        {word:"DINOSAUR",icon:"🦖",zh:"恐龍"},{word:"CASTLE",icon:"🏰",zh:"城堡"},{word:"KING",icon:"👑",zh:"國王"},{word:"QUEEN",icon:"👸",zh:"女王"},
        {word:"MUSEUM",icon:"🏛️",zh:"博物館"},{word:"MUSIC",icon:"🎵",zh:"音樂"},{word:"GUITAR",icon:"🎸",zh:"吉他"},{word:"PAINTING",icon:"🎨",zh:"繪畫"},
        {word:"CAMERA",icon:"📷",zh:"相機"},{word:"COMPUTER",icon:"💻",zh:"電腦"},{word:"TELESCOPE",icon:"🔭",zh:"望遠鏡"},{word:"COMPASS",icon:"🧭",zh:"指南針"},
        {word:"VOLCANO",icon:"🌋",zh:"火山"},{word:"OCEAN",icon:"🌊",zh:"海洋"},{word:"BUTTERFLY",icon:"🦋",zh:"蝴蝶"},{word:"SUNFLOWER",icon:"🌻",zh:"向日葵"},
        {word:"UMBRELLA",icon:"☂️",zh:"雨傘"},{word:"DRAGON",icon:"🐉",zh:"飛龍"},{word:"UNICORN",icon:"🦄",zh:"獨角獸"},{word:"TREASURE",icon:"💎",zh:"寶藏"},
        {word:"SCIENCE",icon:"🔬",zh:"科學"}
      ]
    };

    var currentMode = 'spelling';
    var currentLevel = 1;
    var questions = [];
    var currentIndex = 0;
    var currentAnswer = [];
    var starsCount = 0;
    var isAnswered = false;
    var speechRate = 0.8;

    function forceUnlockAudio() {
      try {
        if ('speechSynthesis' in window) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          var dummy = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummy);
        }
        playTone(440, 0.01);
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", function() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
          window.speechSynthesis.getVoices();
        };
      }

      var modeBtns = document.querySelectorAll('.mode-btn');
      modeBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          forceUnlockAudio();
          modeBtns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentMode = btn.getAttribute('data-mode');
        });
      });

      var levelBtns = document.querySelectorAll('.level-btn');
      levelBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          forceUnlockAudio();
          var lvl = parseInt(btn.getAttribute('data-lvl'));
          startLevel(lvl);
        });
      });

      document.getElementById('backBtn').addEventListener('click', function() {
        forceUnlockAudio();
        showMenu();
      });

      document.getElementById('speedToggleBtn').addEventListener('click', function() {
        forceUnlockAudio();
        if (speechRate === 0.8) {
          speechRate = 0.55;
          this.textContent = '語速: 🐢 慢速';
          this.style.backgroundColor = '#ffe3e3';
          this.style.borderColor = '#ff6b6b';
          this.style.color = '#c92a2a';
        } else {
          speechRate = 0.8;
          this.textContent = '語速: 🐇 正常';
          this.style.backgroundColor = '#fff3bf';
          this.style.borderColor = '#ffd43b';
          this.style.color = '#d9480f';
        }
        speakCurrentWord();
      });

      document.getElementById('imageDisplay').addEventListener('click', function() {
        forceUnlockAudio();
        speakCurrentWord();
      });
      
      document.getElementById('nextBtn').addEventListener('click', function() {
        forceUnlockAudio();
        loadNextQuestion();
      });

      document.getElementById('correctBadge').addEventListener('click', function() {
        forceUnlockAudio();
        loadNextQuestion();
      });

      document.getElementById('mascotBtn').addEventListener('click', function() {
        forceUnlockAudio();
        triggerMascotBounce();
        speakText('Hello!');
      });
    });

    function startLevel(lvl) {
      currentLevel = lvl;
      document.body.className = 'bg-lvl-' + lvl;

      var raw = levelData[lvl] || levelData[1];
      questions = raw.slice().sort(function() { return Math.random() - 0.5; });
      currentIndex = 0;
      
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      
      setTimeout(function() {
        initQuestion();
      }, 150);
    }

    function showMenu() {
      document.body.className = '';
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('menuScreen').style.display = 'block';
      updateMascot("🐻", "加油喔！");
    }

    function updateMascot(emoji, text) {
      document.getElementById('mascotBtn').textContent = emoji;
      document.getElementById('mascotBubble').textContent = text;
    }

    function triggerMascotBounce() {
      var mascot = document.getElementById('mascotBtn');
      mascot.classList.remove('bounce');
      void mascot.offsetWidth;
      mascot.classList.add('bounce');
    }

    function triggerConfetti() {
      try {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.6 }
          });
        }
      } catch (e) {}
    }

    function initQuestion() {
      var q = questions[currentIndex];
      if (!q) return;

      isAnswered = false;
      currentAnswer = [];

      document.getElementById('imageIcon').textContent = q.icon;
      document.getElementById('chineseHint').textContent = q.zh || "";
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('correctBadge').classList.remove('show');
      document.getElementById('progressText').textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 題";

      speakCurrentWord();

      var spellingArea = document.getElementById('spellingArea');
      var choiceArea = document.getElementById('choiceArea');

      if (currentMode === 'spelling') {
        spellingArea.style.display = 'block';
        choiceArea.style.display = 'none';
        document.getElementById('instructionText').textContent = "點擊圖片聽發音（點選填錯的字可退回）";
        updateMascot("🐻", "一起拼出來吧！");

        var slotsContainer = document.getElementById('answerSlots');
        slotsContainer.innerHTML = '';
        slotsContainer.classList.remove('shake');

        for (var i = 0; i < q.word.length; i++) {
          (function(index) {
            var slot = document.createElement('div');
            slot.className = 'slot';
            slot.textContent = q.word[index];

            slot.addEventListener('click', function() {
              forceUnlockAudio();
              removeSlotAt(index);
            });
            slotsContainer.appendChild(slot);
          })(i);
        }

        var letters = q.word.split('');
        var extraCount = currentLevel >= 3 ? 3 : 2;
        for (var j = 0; j < extraCount; j++) {
          letters.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
        }
        letters.sort(function() { return Math.random() - 0.5; });

        var poolContainer = document.getElementById('letterPool');
        poolContainer.innerHTML = '';
        for (var k = 0; k < letters.length; k++) {
          (function(char) {
            var btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.textContent = char;
            btn.addEventListener('click', function() { 
              forceUnlockAudio();
              selectLetter(btn, char); 
            });
            poolContainer.appendChild(btn);
          })(letters[k]);
        }

      } else {
        spellingArea.style.display = 'none';
        choiceArea.style.display = 'block';
        
        if (currentLevel === 1 || currentLevel === 2) {
          document.getElementById('instructionText').textContent = "點擊 🔊 聽英式單字發音，選出正確答案！";
        } else {
          document.getElementById('instructionText').textContent = "點擊圖片聽英式發音，選出正確答案！";
        }
        
        updateMascot("🐻", "選出正確的單字！");

        var currentList = levelData[currentLevel] || levelData[1];
        var wrongCandidates = currentList.filter(function(item) {
          return item.word !== q.word;
        });
        wrongCandidates.sort(function() { return Math.random() - 0.5; });

        var options = [q.word];
        for (var i2 = 0; i2 < Math.min(2, wrongCandidates.length); i2++) {
          options.push(wrongCandidates[i2].word);
        }
        options.sort(function() { return Math.random() - 0.5; });

        var optionsContainer = document.getElementById('wordOptions');
        optionsContainer.innerHTML = '';

        for (var j2 = 0; j2 < options.length; j2++) {
          (function(wordChoice) {
            var row = document.createElement('div');
            row.className = 'word-option-row';

            var btn = document.createElement('button');
            btn.className = 'word-option-btn';
            btn.textContent = wordChoice;
            btn.addEventListener('click', function() {
              forceUnlockAudio();
              checkOption(btn, wordChoice, q.word);
            });

            row.appendChild(btn);

            if (currentLevel === 1 || currentLevel === 2) {
              var audioBtn = document.createElement('button');
              audioBtn.className = 'audio-btn';
              audioBtn.textContent = '🔊';
              audioBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                forceUnlockAudio();
                speakText(wordChoice);
              });
              row.appendChild(audioBtn);
            }

            optionsContainer.appendChild(row);
          })(options[j2]);
        }
      }
    }

    function selectLetter(btn, char) {
      var targetWord = questions[currentIndex].word;
      if (currentAnswer.length < targetWord.length) {
        currentAnswer.push({ char: char, btnRef: btn });
        btn.classList.add('disabled');
        
        triggerHaptic(15);
        speakText(char);

        var slots = document.querySelectorAll('.slot');
        var activeSlot = slots[currentAnswer.length - 1];
        if (activeSlot) {
          activeSlot.textContent = char;
          activeSlot.classList.add('filled');
        }

        if (currentAnswer.length === targetWord.length) {
          checkSpellingAnswer();
        }
      }
    }

    function removeSlotAt(index) {
      if (index >= 0 && index < currentAnswer.length) {
        var item = currentAnswer[index];
        item.btnRef.classList.remove('disabled');

        var targetWord = questions[currentIndex].word;
        var slots = document.querySelectorAll('.slot');
        
        currentAnswer.splice(index, 1);

        for (var i = 0; i < slots.length; i++) {
          if (i < currentAnswer.length) {
            slots[i].textContent = currentAnswer[i].char;
            slots[i].classList.add('filled');
          } else {
            slots[i].textContent = targetWord[i];
            slots[i].classList.remove('filled');
          }
        }
      }
    }

    function checkSpellingAnswer() {
      var userWord = "";
      for (var i = 0; i < currentAnswer.length; i++) {
        userWord += currentAnswer[i].char;
      }
      var targetWord = questions[currentIndex].word;
      var slotsContainer = document.getElementById('answerSlots');

      if (userWord === targetWord) {
        handleSuccess(targetWord);
      } else {
        updateMascot("💪", "再試一次喔！");
        playTone(196.00, 0.3);
        slotsContainer.classList.add('shake');
        triggerHaptic([100, 50, 100]);

        setTimeout(function() {
          speakText("Try again!");
          resetSpellingQuestion();
        }, 600);
      }
    }

    function resetSpellingQuestion() {
      var targetWord = questions[currentIndex].word;
      currentAnswer = [];
      var slotsContainer = document.getElementById('answerSlots');
      slotsContainer.classList.remove('shake');

      var slots = document.querySelectorAll('.slot');
      for (var i = 0; i < slots.length; i++) {
        slots[i].textContent = targetWord[i];
        slots[i].classList.remove('filled');
      }

      var btns = document.querySelectorAll('.letter-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('disabled');
      }
    }

    function checkOption(btn, selectedWord, targetWord) {
      if (isAnswered) return;

      if (selectedWord === targetWord) {
        btn.classList.add('correct');
        handleSuccess(targetWord);
      } else {
        btn.classList.add('wrong');
        updateMascot("💪", "再試一次喔！");
        playTone(196.00, 0.3);
        triggerHaptic([100, 50, 100]);
        speakText("Try again!");

        setTimeout(function() {
          btn.classList.remove('wrong');
        }, 800);
      }
    }

    function handleSuccess(targetWord) {
      isAnswered = true;
      starsCount += 1;
      document.getElementById('starScore').textContent = starsCount;
      
      updateMascot("🥳", "Brilliant!");
      triggerMascotBounce();
      triggerConfetti();

      playTone(523.25, 0.15);
      setTimeout(function() { playTone(659.25, 0.25); }, 150);

      triggerHaptic([30, 50, 30]);
      document.getElementById('correctBadge').classList.add('show');

      setTimeout(function() {
        speakText("Brilliant! " + targetWord);
        document.getElementById('nextBtn').style.display = 'inline-block';
      }, 300);
    }

    function loadNextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      initQuestion();
    }

    function playTone(freq, duration) {
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(pattern) {
      try {
        if ('vibrate' in navigator) navigator.vibrate(pattern);
      } catch (e) {}
    }

    // 發音切換為英式英語 (en-GB / British Accent)
    function speakText(text) {
      try {
        if ('speechSynthesis' in window) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.cancel();
          
          var lower = text.toLowerCase();
          var utterance = new SpeechSynthesisUtterance(lower);
          utterance.lang = 'en-GB'; // 設定為英式英語
          utterance.rate = speechRate;
          
          var voices = window.speechSynthesis.getVoices();
          var ukVoice = null;
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang === 'en-GB' || voices[i].lang === 'en_GB') {
              ukVoice = voices[i];
              break;
            }
          }
          if (ukVoice) {
            utterance.voice = ukVoice;
          }

          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {}
    }

    function speakCurrentWord() {
      if (questions[currentIndex]) {
        speakText(questions[currentIndex].word);
      }
    }
  </script>
</body>
</html>
