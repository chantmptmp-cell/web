<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒英文單字學習遊戲 (雙語對照版)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 520px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 32px;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    .mascot {
      font-size: 36px;
      cursor: pointer;
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    .hint-selector-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .hint-selector-box label {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .hint-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .hint-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hint-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      touch-action: manipulation;
    }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .progress-text {
      font-size: 16px;
      font-weight: bold;
      color: #495057;
    }

    /* 圖片與中文顯示區域 */
    .image-container {
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .image-icon {
      font-size: 85px;
      line-height: 1;
    }
    .chinese-hint {
      font-size: 22px;
      font-weight: bold;
      color: #d9480f;
      margin-top: 4px;
    }
    .hint-text {
      color: #868e96;
      font-size: 13px;
      margin-top: 4px;
    }

    .answer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }
    .answer-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .slot {
      width: 48px;
      height: 56px;
      border-bottom: 4px solid #4dabf7;
      font-size: 32px;
      font-weight: bold;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot.show-trace {
      color: rgba(25, 113, 194, 0.25);
    }
    .slot.filled {
      color: #1971c2 !important;
      background-color: #e7f5ff;
      border-bottom-color: #1971c2;
    }

    .delete-btn {
      width: 44px;
