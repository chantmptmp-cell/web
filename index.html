<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒英文單字學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 520px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 32px;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    .mascot {
      font-size: 36px;
      cursor: pointer;
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    .hint-selector-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .hint-selector-box label {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .hint-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .hint-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hint-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      touch-action: manipulation;
    }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .progress-text {
      font-size: 16px;
      font-weight: bold;
      color: #495057;
    }

    .image-container {
      font-size: 95px;
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hint-text {
      color: #868e96;
      font-size: 13px;
      margin-top: 4px;
    }

    .answer-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .slot {
      width: 48px;
      height: 56px;
      border-bottom: 4px solid #4dabf7;
      font-size: 32px;
      font-weight: bold;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 10px 10px 0 0;
    }
    .slot.show-trace {
      color: rgba(25, 113, 194, 0.25);
    }
    .slot.filled {
      color: #1971c2 !important;
      background-color: #e7f5ff;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    .letters-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .letter-btn {
      width: 52px;
      height: 52px;
      color: white;
      font-size: 28px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .letter-btn:nth-child(5n+1) { background-color: #ff6b6b; box-shadow: 0 5px 0 #c92a2a; }
    .letter-btn:nth-child(5n+2) { background-color: #4c6ef5; box-shadow: 0 5px 0 #364fc7; }
    .letter-btn:nth-child(5n+3) { background-color: #51cf66; box-shadow: 0 5px 0 #2b8a3e; }
    .letter-btn:nth-child(5n+4) { background-color: #fcc419; box-shadow: 0 5px 0 #e67700; color: #333; }
    .letter-btn:nth-child(5n+5) { background-color: #cc5de8; box-shadow: 0 5px 0 #862e9c; }
    .letter-btn.disabled { visibility: hidden; }

    .next-btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      display: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div id="correctBadge" class="correct-badge">Super Star! 🌟</div>

    <div class="header-bar">
      <div class="mascot" id="mascotBtn">🐻</div>
      <div id="mascotBubble" style="font-size: 14px; font-weight: bold; color: #495057;">加油喔！</div>
      <div class="score-board">⭐ <span id="starScore">0</span></div>
    </div>

    <!-- 主選單 -->
    <div id="menuScreen">
      <h2>請選擇學習關卡 🎯</h2>

      <div class="hint-selector-box">
        <label>💡 請選擇提示輔助模式：</label>
        <div class="hint-options">
          <button class="hint-btn active" data-hint="trace">🔤 全字母虛線</button>
          <button class="hint-btn" data-hint="partial">🧩 部分字母虛線</button>
          <button class="hint-btn" data-hint="audio">🔊 純語音提示</button>
          <button class="hint-btn" data-hint="none">🎯 無提示挑戰</button>
        </div>
      </div>

      <div class="level-menu">
        <button class="level-btn lvl-1" data-lvl="1">Level 1: 幼兒入門 (3字母) <span>50題</span></button>
        <button class="level-btn lvl-2" data-lvl="2">Level 2: 基礎進階 (4字母) <span>55題</span></button>
        <button class="level-btn lvl-3" data-lvl="3">Level 3: 中級探索 (5字母) <span>50題</span></button>
        <button class="level-btn lvl-4" data-lvl="4">Level 4: 高級挑戰 (6+字母) <span>50題</span></button>
        <button class="level-btn lvl-5" data-lvl="5">Level 5: 英語小達人 (綜合) <span>50題</span></button>
      </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" id="backBtn">➔ 返回選單</button>
        <span class="progress-text" id="progressText">第 1 / 50 題</span>
      </div>

      <div class="image-container" id="imageDisplay">🐱</div>
      <div class="hint-text">點擊圖片聽正確發音</div>

      <div class="answer-container" id="answerSlots"></div>
      <div class="letters-container" id="letterPool"></div>

      <button class="next-btn" id="nextBtn">下一題 ➔</button>
    </div>
  </div>

        {word:"HOME",icon:"🏠"},{word:"FARM",icon:"🚜"},{word:"BELL",icon:"🔔"}
      ],
      3: [
        {word:"APPLE",icon:"🍎"},{word:"PIZZA",icon:"🍕"},{word:"TIGER",icon:"🐯"},{word:"ZEBRA",icon:"🦓"},
        {word:"PANDA",icon:"🐼"},{word:"CAMEL",icon:"🐫"},{word:"KOALA",icon:"🐨"},{word:"SNAKE",icon:"🐍"},
        {word:"WHALE",icon:"🐳"},{word:"SHARK",icon:"🦈"},{word:"HOUSE",icon:"🏠"},{word:"TRAIN",icon:"🚆"},

        {word:"PHONE",icon:"📱"},{word:"BREAD",icon:"🍞"},{word:"CANDY",icon:"🍬"},{word:"DONUT",icon:"🍩"},{word:"LEMON",icon:"🍋"},
        {word:"PEACH",icon:"🍑"},{word:"MELON",icon:"🍈"},{word:"MANGO",icon:"🥭"},{word:"GRAPE",icon:"🍇"},
        {word:"PLANT",icon:"🪴"},{word:"GRASS",icon:"🌱"},{word:"WATER",icon:"💧"},{word:"EARTH",icon:"🌍"},
        {word:"BEACH",icon:"🏖️"},{word:"CLOUD",icon:"☁️"},{word:"STORM",icon:"🌩️"},{word:"SKIRT",icon:"👗"},

    var selectedHintMode = 'trace';
    var currentLevel = 1;
    var questions = [];
    var currentIndex = 0;
    var currentAnswer = [];
    var starsCount = 0;

    // 頁面加載完成後自動綁定事件監聽器
    document.addEventListener("DOMContentLoaded", function() {
      // 綁定提示模式按鈕
      var hintBtns = document.querySelectorAll('.hint-btn');
      hintBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          hintBtns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          selectedHintMode = btn.getAttribute('data-hint');
        });
      });

      // 綁定關卡按鈕
      var levelBtns = document.querySelectorAll('.level-btn');
      levelBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var lvl = parseInt(btn.getAttribute('data-lvl'));
          startLevel(lvl);
        });
      });

      // 綁定其它按鈕
      document.getElementById('backBtn').addEventListener('click', showMenu);
      document.getElementById('imageDisplay').addEventListener('click', speakCurrentWord);
      document.getElementById('nextBtn').addEventListener('click', loadNextQuestion);
      document.getElementById('mascotBtn').addEventListener('click', function() {
        speakText('Hello! Let us play together!');
      });
    });

    function startLevel(lvl) {
      currentLevel = lvl;
      var raw = levelData[lvl] || levelData[1];
      questions = raw.slice().sort(function() { return Math.random() - 0.5; });
      currentIndex = 0;
      
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      initQuestion();
    }

    function showMenu() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('menuScreen').style.display = 'block';
      updateMascot("🐻", "加油喔！");
    }

    function updateMascot(emoji, text) {
      document.getElementById('mascotBtn').textContent = emoji;
      document.getElementById('mascotBubble').textContent = text;
    }

    function initQuestion() {
      var q = questions[currentIndex];
      if (!q) return;

      document.getElementById('imageDisplay').textContent = q.icon;
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('correctBadge').classList.remove('show');
      document.getElementById('progressText').textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 題";
      currentAnswer = [];

      updateMascot("🐻", "一起拼出來吧！");

      if (selectedHintMode !== 'none') {
        speakCurrentWord();
      }

      var slotsContainer = document.getElementById('answerSlots');
      slotsContainer.innerHTML = '';
      slotsContainer.classList.remove('shake');
      
      for (var i = 0; i < q.word.length; i++) {
        var slot = document.createElement('div');
        slot.className = 'slot';
        
        var showLetter = false;
        if (selectedHintMode === 'trace') showLetter = true;
        else if (selectedHintMode === 'partial') {
          if (i === 0) showLetter = true;
          else if (q.word.length >= 5 && i % 2 === 0) showLetter = true;
        }

        if (showLetter) {
          slot.textContent = q.word[i];
          slot.classList.add('show-trace');
        } else {
          slot.textContent = '';
        }
        
        slotsContainer.appendChild(slot);
      }

      var letters = q.word.split('');
      var extraCount = currentLevel >= 3 ? 3 : 2;
      for (var j = 0; j < extraCount; j++) {
        letters.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
      }
      letters.sort(function() { return Math.random() - 0.5; });

      var poolContainer = document.getElementById('letterPool');
      poolContainer.innerHTML = '';
      for (var k = 0; k < letters.length; k++) {
        (function(char) {
          var btn = document.createElement('button');
          btn.className = 'letter-btn';
          btn.textContent = char;
          btn.addEventListener('click', function() { selectLetter(btn, char); });
          poolContainer.appendChild(btn);
        })(letters[k]);
      }
    }

    function selectLetter(btn, char) {
      var targetWord = questions[currentIndex].word;
      if (currentAnswer.length < targetWord.length) {
        currentAnswer.push(char);
        btn.classList.add('disabled');
        
        triggerHaptic(15);
        speakText(char);

        var slots = document.querySelectorAll('.slot');
        var activeSlot = slots[currentAnswer.length - 1];
        if (activeSlot) {
          activeSlot.textContent = char;
          activeSlot.classList.add('filled');
        }

        if (currentAnswer.length === targetWord.length) {
          checkAnswer();
        }
      }
    }

    function checkAnswer() {
      var userWord = currentAnswer.join('');
      var targetWord = questions[currentIndex].word;
      var slotsContainer = document.getElementById('answerSlots');

      if (userWord === targetWord) {
        starsCount += 1;
        document.getElementById('starScore').textContent = starsCount;
        updateMascot("🥳", "超級厲害！");

        playTone(523.25, 0.15);
        setTimeout(function() { playTone(659.25, 0.25); }, 150);

        triggerHaptic([30, 50, 30]);
        document.getElementById('correctBadge').classList.add('show');

        setTimeout(function() {
          speakText("Amazing! " + targetWord);
          document.getElementById('nextBtn').style.display = 'inline-block';
        }, 300);
      } else {
        updateMascot("💪", "加油！再試一次！");
        playTone(196.00, 0.3);
        slotsContainer.classList.add('shake');
        triggerHaptic([100, 50, 100]);

        setTimeout(function() {
          speakText("Try again!");
          resetCurrentQuestion();
        }, 600);
      }
    }

    function resetCurrentQuestion() {
      var targetWord = questions[currentIndex].word;
      currentAnswer = [];
      var slotsContainer = document.getElementById('answerSlots');
      slotsContainer.classList.remove('shake');

      var slots = document.querySelectorAll('.slot');
      for (var i = 0; i < slots.length; i++) {
        var showLetter = false;
        if (selectedHintMode === 'trace') showLetter = true;
        else if (selectedHintMode === 'partial') {
          if (i === 0) showLetter = true;
          else if (targetWord.length >= 5 && i % 2 === 0) showLetter = true;
        }

        slots[i].textContent = showLetter ? targetWord[i] : '';
        slots[i].classList.remove('filled');
      }

      var btns = document.querySelectorAll('.letter-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('disabled');
      }
    }

    function loadNextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      initQuestion();
    }

    function playTone(freq, duration) {
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(pattern) {
      try {
        if ('vibrate' in navigator) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function speakText(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var utterance = new SpeechSynthesisUtterance(text.toLowerCase());
          utterance.lang = 'en-US';
          utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {}
    }

    function speakCurrentWord() {
      if (questions[currentIndex]) {
        speakText(questions[currentIndex].word);
      }
    }
  </script>
</body>
</html>
