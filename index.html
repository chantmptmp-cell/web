<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>幼兒英文單字學習遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 520px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    .mute-notice {
      background: #fff0f6;
      border: 1px solid #ffdeeb;
      color: #c2255c;
      font-size: 12px;
      font-weight: bold;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 32px;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    .mascot {
      font-size: 36px;
      cursor: pointer;
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    .hint-selector-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .hint-selector-box label {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .hint-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .hint-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      touch-action: manipulation;
    }
    .hint-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .level-btn {
      padding: 14px 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      touch-action: manipulation;
    }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .progress-text {
      font-size: 16px;
      font-weight: bold;
      color: #495057;
    }

    .image-container {
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 15px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .image-icon {
      font-size: 90px;
      line-height: 1;
    }
    .chinese-hint {
      font-size: 24px;
      font-weight: bold;
      color: #d9480f;
      margin-top: 6px;
    }
    .hint-text {
      color: #868e96;
      font-size: 13px;
      margin-top: 6px;
    }

    /* 單字選擇按鈕區域 */
    .word-options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .word-option-btn {
      padding: 16px 20px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #1c7ed6;
      background-color: #e7f5ff;
      border: 3px solid #74c0fc;
      border-radius: 18px;
      box-shadow: 0 4px 0 #4dabf7;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, background-color 0.2s;
    }
    .word-option-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #4dabf7;
    }
    .word-option-btn.correct {
      background-color: #d3f9d8 !important;
      border-color: #40c057 !important;
      color: #2b8a3e !important;
      box-shadow: 0 4px 0 #2b8a3e !important;
    }
    .word-option-btn.wrong {
      background-color: #ffe3e3 !important;
      border-color: #ff6b6b !important;
      color: #c92a2a !important;
      box-shadow: 0 4px 0 #c92a2a !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    .next-btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      display: none;
      touch-action: manipulation;
    }
  </style>
</head>

  <div class="game-card">

    <div id="correctBadge" class="correct-badge">Super Star! 🌟</div>

    <div id="menuScreen">

        <button class="level-btn lvl-3" data-lvl="3">Level 3: 中級探索 (5字母) <span>50題</span></button>
        <button class="level-btn lvl-4" data-lvl="4">Level 4: 高級挑戰 (6+字母) <span>50題</span></button>
        <button class="level-btn lvl-5" data-lvl="5">Level 5: 英語小達人 (綜合) <span>50題</span></button>
      </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" id="backBtn">➔ 返回選單</button>
        <span class="progress-text" id="progressText">第 1 / 50 題</span>
      </div>

      <div class="image-container" id="imageDisplay">
        <div class="image-icon" id="imageIcon">🐱</div>
        <div class="chinese-hint" id="chineseHint">貓咪</div>
      </div>
      <div class="hint-text">點擊圖片聽發音，選出正確的英文單字！</div>

      <!-- 下方單字選擇區 -->
      <div class="word-options-container" id="wordOptions"></div>

      <button class="next-btn" id="nextBtn">下一題 ➔</button>
    </div>
  </div>

        {word:"SWIMMING",icon:"🏊",zh:"游泳"},{word:"HOSPITAL",icon:"🏥",zh:"醫院"},{word:"PHARMACY",icon:"💊",zh:"藥房"},{word:"AIRPORT",icon:"✈️",zh:"機場"},
        {word:"DINOSAUR",icon:"🦖",zh:"恐龍"},{word:"UNICORN",icon:"🦄",zh:"獨角獸"},{word:"MONSTER",icon:"👾",zh:"怪獸"},{word:"FIREWORKS",icon:"🎆",zh:"煙花"},
        {word:"TELESCOPE",icon:"🔭",zh:"望遠鏡"},{word:"MICROSCOPE",icon:"🔬",zh:"顯微鏡"},{word:"COMPASS",icon:"🧭",zh:"指南針"},{word:"SANDWICH",icon:"🥪",zh:"三文治"},
        {word:"CHOCOLATE",icon:"🍫",zh:"朱古力"},{word:"BUTTERFLY",icon:"🦋",zh:"蝴蝶"},{word:"LADYBUG",icon:"🐞",zh:"甲蟲"}
      ]
    };

    var currentLevel = 1;
    var questions = [];
    var currentIndex = 0;
    var starsCount = 0;
    var isAnswered = false;

    function forceUnlockAudio() {
      try {
        if ('speechSynthesis' in window) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          var dummy = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummy);
        }
        playTone(440, 0.01);
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", function() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
          window.speechSynthesis.getVoices();
        };
      }

      var levelBtns = document.querySelectorAll('.level-btn');
      levelBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          forceUnlockAudio();
          var lvl = parseInt(btn.getAttribute('data-lvl'));
          startLevel(lvl);
        });
      });

      document.getElementById('backBtn').addEventListener('click', function() {
        forceUnlockAudio();
        showMenu();
      });
      document.getElementById('imageDisplay').addEventListener('click', function() {
        forceUnlockAudio();
        speakCurrentWord();
      });
      document.getElementById('nextBtn').addEventListener('click', function() {
        forceUnlockAudio();
        loadNextQuestion();
      });
      document.getElementById('mascotBtn').addEventListener('click', function() {
        forceUnlockAudio();
        speakText('Hello!');
      });
    });

    function startLevel(lvl) {
      currentLevel = lvl;
      var raw = levelData[lvl] || levelData[1];
      questions = raw.slice().sort(function() { return Math.random() - 0.5; });
      currentIndex = 0;
      
      document.getElementById('menuScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      
      setTimeout(function() {
        initQuestion();
      }, 150);
    }

    function showMenu() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('menuScreen').style.display = 'block';
      updateMascot("🐻", "加油喔！");
    }

    function updateMascot(emoji, text) {
      document.getElementById('mascotBtn').textContent = emoji;
      document.getElementById('mascotBubble').textContent = text;
    }

    function initQuestion() {
      var q = questions[currentIndex];
      if (!q) return;

      isAnswered = false;
      document.getElementById('imageIcon').textContent = q.icon;
      document.getElementById('chineseHint').textContent = q.zh || "";
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('correctBadge').classList.remove('show');
      document.getElementById('progressText').textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 題";

      updateMascot("🐻", "選出正確的單字！");
      speakCurrentWord();

      // 建立選項（1個正確答案 + 2個隨機幹擾項）
      var currentList = levelData[currentLevel] || levelData[1];
      var wrongCandidates = currentList.filter(function(item) {
        return item.word !== q.word;
      });
      wrongCandidates.sort(function() { return Math.random() - 0.5; });

      var options = [q.word];
      for (var i = 0; i < Math.min(2, wrongCandidates.length); i++) {
        options.push(wrongCandidates[i].word);
      }
      options.sort(function() { return Math.random() - 0.5; });

      var optionsContainer = document.getElementById('wordOptions');
      optionsContainer.innerHTML = '';
      optionsContainer.classList.remove('shake');

      for (var j = 0; j < options.length; j++) {
        (function(wordChoice) {
          var btn = document.createElement('button');
          btn.className = 'word-option-btn';
          btn.textContent = wordChoice;
          btn.addEventListener('click', function() {
            forceUnlockAudio();
            checkOption(btn, wordChoice, q.word);
          });
          optionsContainer.appendChild(btn);
        })(options[j]);
      }
    }

    function checkOption(btn, selectedWord, targetWord) {
      if (isAnswered) return;

      if (selectedWord === targetWord) {
        isAnswered = true;
        btn.classList.add('correct');
        starsCount += 1;
        document.getElementById('starScore').textContent = starsCount;
        updateMascot("🥳", "答對了！太棒了！");

        playTone(523.25, 0.15);
        setTimeout(function() { playTone(659.25, 0.25); }, 150);

        triggerHaptic([30, 50, 30]);
        document.getElementById('correctBadge').classList.add('show');

        setTimeout(function() {
          speakText("Great! " + targetWord);
          document.getElementById('nextBtn').style.display = 'inline-block';
        }, 300);
      } else {
        btn.classList.add('wrong');
        updateMascot("💪", "再試一次喔！");
        playTone(196.00, 0.3);
        triggerHaptic([100, 50, 100]);
        speakText("Try again!");

        setTimeout(function() {
          btn.classList.remove('wrong');
        }, 800);
      }
    }

    function loadNextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      initQuestion();
    }

    function playTone(freq, duration) {
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(pattern) {
      try {
        if ('vibrate' in navigator) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function speakText(text) {
      try {
        if ('speechSynthesis' in window) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.cancel();
          
          var lower = text.toLowerCase();
          var utterance = new SpeechSynthesisUtterance(lower);
          utterance.lang = 'en-US';
          utterance.rate = 0.8;
          
          var voices = window.speechSynthesis.getVoices();
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang === 'en-US' || voices[i].lang === 'en_US') {
              utterance.voice = voices[i];
              break;
            }
          }

          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {}
    }

    function speakCurrentWord() {
      if (questions[currentIndex]) {
        speakText(questions[currentIndex].word);
      }
    }
  </script>
</body>
</html>
