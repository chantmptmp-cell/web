<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS 專用全螢幕無邊框 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英式英文遊戲">
  
  <title>幼兒英式英文單字學習遊戲</title>
  <!-- 引入輕量級 Confetti 彩帶特效庫 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
      transition: background 0.8s ease;
    }

    /* 各關卡背景主題色 */
    body.bg-lvl-1 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
    body.bg-lvl-2 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
    body.bg-lvl-3 { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
    body.bg-lvl-4 { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
    body.bg-lvl-5 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }

    .game-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      width: 100%;
      max-width: 600px;
      position: relative;
      overflow: hidden;
      border: 4px solid #fff;
    }

    @media all and (display-mode: standalone) {
      .game-card {
        max-width: 100%;
        border-radius: 32px;
      }
    }

    .mute-notice {
      background: #fff0f6;
      border: 1px solid #ffdeeb;
      color: #c2255c;
      font-size: 12px;
      font-weight: bold;
      padding: 6px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .correct-badge {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #51cf66;
      color: white;
      font-size: 28px;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 50px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      z-index: 100;
      cursor: pointer;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }
    .correct-badge.show {
      transform: translate(-50%, -50%) scale(1.1);
      pointer-events: auto;
    }
    .correct-badge:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
    .correct-badge-sub {
      font-size: 14px;
      display: block;
      margin-top: 4px;
      opacity: 0.9;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff9db;
      border-radius: 18px;
      padding: 8px 16px;
      margin-bottom: 12px;
    }
    
    .mascot {
      font-size: 36px;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s;
    }
    .mascot.bounce {
      animation: mascotBounce 0.5s ease;
    }
    @keyframes mascotBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.2); }
    }

    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #fcc419;
      text-shadow: 1px 1px 0 #e67700;
    }

    .setting-box {
      background: #f8f9fa;
      border: 2px dashed #bac8ff;
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: left;
    }
    .setting-box label.title {
      font-weight: bold;
      color: #495057;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .mode-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      padding: 10px 6px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid #ced4da;
      border-radius: 12px;
      background: white;
      color: #495057;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mode-btn.active {
      background: #4c6ef5;
      color: white;
      border-color: #364fc7;
      box-shadow: 0 3px 6px rgba(76,110,245,0.3);
    }

    .count-select {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
      color: #364fc7;
      background-color: white;
      border: 2px solid #74c0fc;
      border-radius: 12px;
      outline: none;
    }

    .topics-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 12px;
      margin-top: 6px;
    }
    .topic-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
    }
    .topic-item input {
      width: 16px;
      height: 16px;
      accent-color: #4c6ef5;
    }
    .topic-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .action-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      background: #e9ecef;
      border: 1px solid #ced4da;
      border-radius: 8px;
      cursor: pointer;
    }

    .level-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .level-btn {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      touch-action: manipulation;
    }
    .lvl-1 { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .lvl-2 { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .lvl-3 { background-color: #339af0; box-shadow: 0 4px 0 #1864ab; }
    .lvl-4 { background-color: #20c997; box-shadow: 0 4px 0 #087f5b; }
    .lvl-5 { background-color: #fcc419; color: #333; box-shadow: 0 4px 0 #e67700; }

    .start-game-btn {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 20px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      margin-top: 10px;
      touch-action: manipulation;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .back-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background-color: #adb5bd;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tool-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      border: 2px solid;
    }
    .speed-btn {
      background-color: #fff3bf;
      color: #d9480f;
      border-color: #ffd43b;
    }

    .progress-text {
      font-size: 15px;
      font-weight: bold;
      color: #495057;
    }

    .image-container {
      background: #fff9db;
      border: 4px dashed #ffd43b;
      border-radius: 24px;
      padding: 12px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s;
    }
    .image-container:active {
      transform: scale(0.98);
    }
    .image-icon {
      font-size: 85px;
      line-height: 1;
    }
    .chinese-hint {
      font-size: 22px;
      font-weight: bold;
      color: #d9480f;
      margin-top: 4px;
    }
    .hint-text {
      color: #e65c00;
      font-size: 14px;
      font-weight: bold;
      margin-top: 6px;
      min-height: 20px;
    }

    .answer-container {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .slot {
      width: 42px;
      height: 52px;
      border-bottom: 4px solid #4dabf7;
      font-size: 28px;
      font-weight: bold;
      color: rgba(25, 113, 194, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f3f5;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      transition: all 0.15s;
    }
    .slot.filled {
      color: #1971c2 !important;
      background-color: #e7f5ff;
      border-bottom-color: #1971c2;
    }

    .letters-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .letter-btn {
      width: 48px;
      height: 48px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s;
    }
    .letter-btn:active {
      transform: translateY(3px);
    }
    .letter-btn:nth-child(5n+1) { background-color: #ff6b6b; box-shadow: 0 4px 0 #c92a2a; }
    .letter-btn:nth-child(5n+2) { background-color: #4c6ef5; box-shadow: 0 4px 0 #364fc7; }
    .letter-btn:nth-child(5n+3) { background-color: #51cf66; box-shadow: 0 4px 0 #2b8a3e; }
    .letter-btn:nth-child(5n+4) { background-color: #fcc419; box-shadow: 0 4px 0 #e67700; color: #333; }
    .letter-btn:nth-child(5n+5) { background-color: #cc5de8; box-shadow: 0 4px 0 #862e9c; }
    .letter-btn.disabled { visibility: hidden; }

    .word-options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0;
    }
    .word-option-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .word-option-btn {
      flex: 1;
      padding: 14px 16px;
      font-size: 22px;
      font-weight: bold;
      color: #1c7ed6;
      background-color: #e7f5ff;
      border: 3px solid #74c0fc;
      border-radius: 16px;
      box-shadow: 0 4px 0 #4dabf7;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
      transition: all 0.2s;
    }
    .word-option-btn:active {
      transform: translateY(2px);
    }
    .word-option-btn.correct {
      background-color: #d3f9d8 !important;
      border-color: #40c057 !important;
      color: #2b8a3e !important;
      box-shadow: 0 4px 0 #2b8a3e !important;
    }
    .word-option-btn.wrong {
      background-color: #ffe3e3 !important;
      border-color: #ff6b6b !important;
      color: #c92a2a !important;
      box-shadow: 0 4px 0 #c92a2a !important;
    }
    .word-option-btn.locked {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(80%);
    }

    .audio-btn {
      width: 52px;
      height: 52px;
      font-size: 22px;
      background-color: #fff3bf;
      border: 3px solid #fcc419;
      border-radius: 16px;
      box-shadow: 0 4px 0 #fab005;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .audio-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #fab005;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }

    .next-btn {
      margin-top: 15px;
      padding: 12px 32px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(180deg, #51cf66 0%, #2b8a3e 100%);
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 5px 0 #2b8a3e;
      cursor: pointer;
      display: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="mute-notice">🇬🇧 英式發音模式 ｜ 🔔 若無聲請關閉靜音模式</div>
    
    <div id="correctBadge" class="correct-badge">
      Super Star! 🌟
      <span class="correct-badge-sub">點擊繼續 ➔</span>
    </div>

    <div class="header-bar">
      <div class="mascot" id="mascotBtn">🐻</div>
      <div id="mascotBubble" style="font-size: 14px; font-weight: bold; color: #495057;">點擊開啟聲音！</div>
      <div class="score-board">⭐ <span id="starScore">0</span></div>
    </div>

    <!-- 主選單：階段一 選擇 Level -->
    <div id="menuScreen">
      <h2>請選擇學習關卡 🇬🇧🎯</h2>

      <div class="setting-box">
        <label class="title">🎮 請選擇遊戲玩法：</label>
        <div class="mode-options">
          <button class="mode-btn active" data-mode="spelling">🔤 字母拼字模式</button>
          <button class="mode-btn" data-mode="choice">🧩 看圖選單字模式</button>
        </div>
      </div>

      <div class="level-menu">
        <button class="level-btn lvl-1" data-lvl="1">Level 1: 啟蒙 (2-3歲) <span>點擊設定 ➔</span></button>
        <button class="level-btn lvl-2" data-lvl="2">Level 2: 幼兒 (3-4歲) <span>點擊設定 ➔</span></button>
        <button class="level-btn lvl-3" data-lvl="3">Level 3: 幼高 (4-5歲) <span>點擊設定 ➔</span></button>
        <button class="level-btn lvl-4" data-lvl="4">Level 4: 小一 (5-6歲) <span>點擊設定 ➔</span></button>
        <button class="level-btn lvl-5" data-lvl="5">Level 5: 小二 (6-7歲) <span>點擊設定 ➔</span></button>
      </div>
    </div>

    <!-- 主選單：階段二 自訂題目與主題選單 -->
    <div id="topicScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" id="cancelLevelBtn">➔ 重新選關卡</button>
        <span class="progress-text" id="selectedLevelTitle">Level 1 設定</span>
      </div>

      <div class="setting-box">
        <label class="title">🔊 答案選項旁的發音按鈕：</label>
        <select class="count-select" id="optionAudioBtnToggleSelect">
          <option value="on">🔊 開啟（選項旁顯示 🔊 小發音按鈕）</option>
          <option value="off">🔇 關閉（隱藏選項發音按鈕，僅看字選擇）</option>
        </select>
      </div>

      <div class="setting-box">
        <label class="title">🎲 每次練習題目數量：</label>
        <select class="count-select" id="customCountSelect">
          <option value="default">預設關卡題數 (5~25題)</option>
          <option value="5">每次 5 題</option>
          <option value="10">每次 10 題</option>
          <option value="15">每次 15 題</option>
          <option value="20">每次 20 題</option>
          <option value="25">每次 25 題</option>
          <option value="50">每次 50 題</option>
          <option value="150">挑戰選定主題全部題目</option>
        </select>
      </div>

      <div class="setting-box">
        <label class="title">📚 請勾選練習主題（可複選多項）：</label>
        <div class="topic-actions">
          <button class="action-btn" id="selectAllTopicsBtn">全選</button>
          <button class="action-btn" id="deselectAllTopicsBtn">全不選</button>
        </div>
        <div class="topics-container" id="topicsContainer"></div>
      </div>

      <button class="start-game-btn" id="startGameBtn">🚀 開始練習！</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="gameScreen" style="display: none;">
      <div class="top-bar">
        <button class="back-btn" id="backBtn">➔ 返回選單</button>
        <button class="tool-btn speed-btn" id="speedToggleBtn">語速: 🐇 正常</button>
        <span class="progress-text" id="progressText">第 1 / 5 題</span>
      </div>

      <div class="image-container" id="imageDisplay">
        <div class="image-icon" id="imageIcon">🐱</div>
        <div class="chinese-hint" id="chineseHint">貓咪</div>
      </div>
      <div class="hint-text" id="instructionText">點擊圖片聽英式發音</div>

      <!-- 模式一：拼字區域 -->
      <div id="spellingArea" style="display: none;">
        <div class="answer-container" id="answerSlots"></div>
        <div class="letters-container" id="letterPool"></div>
      </div>

      <!-- 模式二：選擇單字區域 -->
      <div id="choiceArea" style="display: none;">
        <div class="word-options-container" id="wordOptions"></div>
      </div>

      <button class="next-btn" id="nextBtn">下一題 ➔</button>
    </div>
  </div>

  <script>
    var defaultLevelCounts = { 1: 5, 2: 10, 3: 15, 4: 20, 5: 25 };

    var levelCategorizedData = {
      1: {
        "身體部位": [
          {word:"EYE",icon:"👁️",zh:"眼睛"},{word:"EAR",icon:"👂",zh:"耳朵"},{word:"NOSE",icon:"👃",zh:"鼻子"},
          {word:"HAND",icon:"✋",zh:"手掌"},{word:"FOOT",icon:"🦶",zh:"腳掌"},{word:"LIP",icon:"👄",zh:"嘴唇"},
          {word:"LEG",icon:"🦵",zh:"大腿"},{word:"ARM",icon:"🦾",zh:"手臂"},{word:"FACE",icon:"😀",zh:"臉龐"},{word:"HAIR",icon:"💇",zh:"頭髮"}
        ],
        "家庭成員": [
          {word:"MUM",icon:"👩",zh:"媽媽"},{word:"DAD",icon:"👨",zh:"爸爸"},{word:"BABY",icon:"👶",zh:"BB"},
          {word:"BOY",icon:"👦",zh:"男孩"},{word:"GIRL",icon:"👧",zh:"女孩"}
        ],
        "基礎動物": [
          {word:"CAT",icon:"🐱",zh:"貓咪"},{word:"DOG",icon:"🐶",zh:"小狗"},{word:"DUCK",icon:"🦆",zh:"鴨子"},
          {word:"BIRD",icon:"🐦",zh:"小鳥"},{word:"FISH",icon:"🐟",zh:"小魚"},{word:"PIG",icon:"🐷",zh:"小豬"},
          {word:"COW",icon:"🐮",zh:"乳牛"},{word:"FOX",icon:"🦊",zh:"狐狸"},{word:"ANT",icon:"🐜",zh:"螞蟻"},
          {word:"BAT",icon:"🦇",zh:"蝙蝠"},{word:"BEE",icon:"🐝",zh:"蜜蜂"},{word:"OWL",icon:"🦉",zh:"貓頭鷹"},
          {word:"RAT",icon:"🐀",zh:"老鼠"},{word:"BEAR",icon:"🐻",zh:"大熊"},{word:"FROG",icon:"🐸",zh:"青蛙"},
          {word:"GOAT",icon:"🐐",zh:"山羊"},{word:"DEER",icon:"🦌",zh:"小鹿"},{word:"LION",icon:"🦁",zh:"獅子"}
        ],
        "色彩天氣": [
          {word:"RED",icon:"🔴",zh:"紅色"},{word:"BLUE",icon:"🔵",zh:"藍色"},{word:"SUN",icon:"☀️",zh:"太陽"},
          {word:"MOON",icon:"🌙",zh:"月亮"},{word:"STAR",icon:"⭐",zh:"星星"},{word:"RAIN",icon:"🌧️",zh:"下雨"},
          {word:"SNOW",icon:"❄️",zh:"下雪"},{word:"FIRE",icon:"🔥",zh:"火苗"},{word:"PINK",icon:"🩷",zh:"粉紅"},{word:"GOLD",icon:"🪙",zh:"金色"}
        ],
        "日常用品": [
          {word:"MILK",icon:"🥛",zh:"牛奶"},{word:"WATER",icon:"💧",zh:"清水"},{word:"BALL",icon:"⚽",zh:"皮球"},
          {word:"BUS",icon:"🚌",zh:"巴士"},{word:"BED",icon:"🛏️",zh:"睡床"},{word:"CUP",icon:"🥤",zh:"水杯"},
          {word:"HAT",icon:"🧢",zh:"帽子"},{word:"EGG",icon:"🥚",zh:"雞蛋"},{word:"BOX",icon:"📦",zh:"盒子"},
          {word:"BAG",icon:"🎒",zh:"書包"},{word:"PEN",icon:"🖊️",zh:"原子筆"},{word:"CAR",icon:"🚗",zh:"汽車"},
          {word:"KEY",icon:"🔑",zh:"鑰匙"},{word:"DOOR",icon:"🚪",zh:"大門"},{word:"BOOK",icon:"📖",zh:"書本"}

      container.innerHTML = '';

      for (var topicName in topicsObj) {
        if (topicsObj.hasOwnProperty(topicName)) {

          label.className = 'topic-item';

      var checkboxes = document.querySelectorAll('#topicsContainer input[type="checkbox"]:checked');

        alert("請至少勾選一個練習主題喔！");
        return;
      }

      var audioToggleVal = document.getElementById('optionAudioBtnToggleSelect').value;
      isOptionAudioBtnEnabled = (audioToggleVal === 'on');

      var topicsObj = levelCategorizedData[selectedLevel] || levelCategorizedData[1];
      var combinedPool = [];

      checkboxes.forEach(function(cb) {
        var topicName = cb.value;
        if (topicsObj[topicName]) {
          combinedPool = combinedPool.concat(topicsObj[topicName]);
        }
      });

      var selectVal = document.getElementById('customCountSelect').value;
      var targetCount = defaultLevelCounts[selectedLevel] || 10;
      if (selectVal !== 'default') {
        targetCount = parseInt(selectVal);
      }

      var shuffled = combinedPool.slice().sort(function() { return Math.random() - 0.5; });
      questions = shuffled.slice(0, Math.min(targetCount, shuffled.length));
      currentIndex = 0;

      document.body.className = 'bg-lvl-' + selectedLevel;
      document.getElementById('topicScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';

      setTimeout(function() {
        initQuestion();
      }, 150);

          });

    function getSmartDistractors(targetWord, fullList, count) {
      var candidates = fullList.filter(function(item) {
        return item.word !== targetWord;
      });

      candidates.sort(function(a, b) {
        var scoreA = 0;
        var scoreB = 0;

        if (a.word.length === targetWord.length) scoreA += 2;
        if (b.word.length === targetWord.length) scoreB += 2;

        if (a.word[0] === targetWord[0]) scoreA += 3;
        if (b.word[0] === targetWord[0]) scoreB += 3;

        if (a.word[a.word.length - 1] === targetWord[targetWord.length - 1]) scoreA += 1;
        if (b.word[b.word.length - 1] === targetWord[targetWord.length - 1]) scoreB += 1;

        return (scoreB + Math.random()) - (scoreA + Math.random());
      });

      var selected = candidates.slice(0, count).map(function(item) { return item.word; });
      return selected;
    }

    function initQuestion() {
      var q = questions[currentIndex];
      if (!q) return;

      isAnswered = false;
      currentAnswer = [];
      wrongAttempts = 0;

      document.getElementById('imageIcon').textContent = q.icon;
      document.getElementById('chineseHint').textContent = q.zh || "";
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('correctBadge').classList.remove('show');
      document.getElementById('progressText').textContent = "第 " + (currentIndex + 1) + " / " + questions.length + " 題";

      speakCurrentWord();

      var spellingArea = document.getElementById('spellingArea');
      var choiceArea = document.getElementById('choiceArea');

      if (currentMode === 'spelling') {
        spellingArea.style.display = 'block';
        choiceArea.style.display = 'none';
        document.getElementById('instructionText').textContent = "點擊圖片聽英式發音（點選填錯的字可退回）";
        updateMascot("🐻", "一起拼出來吧！");

        var slotsContainer = document.getElementById('answerSlots');
        slotsContainer.innerHTML = '';
        slotsContainer.classList.remove('shake');

        for (var i = 0; i < q.word.length; i++) {
          (function(index) {
            var slot = document.createElement('div');
            slot.className = 'slot';
            slot.textContent = q.word[index];

            slot.addEventListener('click', function() {
              forceUnlockAudio();
              removeSlotAt(index);
            });
            slotsContainer.appendChild(slot);
          })(i);
        }

        var letters = q.word.split('');
        var extraCount = selectedLevel >= 3 ? 3 : 2;
        for (var j = 0; j < extraCount; j++) {
          letters.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
        }
        letters.sort(function() { return Math.random() - 0.5; });

        var poolContainer = document.getElementById('letterPool');
        poolContainer.innerHTML = '';
        for (var k = 0; k < letters.length; k++) {
          (function(char) {
            var btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.textContent = char;
            btn.addEventListener('click', function() { 
              forceUnlockAudio();
              selectLetter(btn, char); 
            });
            poolContainer.appendChild(btn);
          })(letters[k]);
        }

      } else {
        spellingArea.style.display = 'none';
        choiceArea.style.display = 'block';
        
        document.getElementById('instructionText').textContent = "點擊圖片聽英式發音，選出正確答案！";
        updateMascot("🐻", "選出正確的單字！");

        var allList = [];
        var levelDataObj = levelCategorizedData[selectedLevel] || levelCategorizedData[1];
        for (var key in levelDataObj) {
          allList = allList.concat(levelDataObj[key]);
        }

        var distractors = getSmartDistractors(q.word, allList, 2);
        currentOptionChoices = [q.word].concat(distractors);

        // 渲染選單（包含隨機打亂）
        renderChoiceOptions();
      }
    }

    // 獨立出來渲染選項，答錯或進入新題目均可再次呼叫重新打亂
    function renderChoiceOptions() {
      var q = questions[currentIndex];
      if (!q) return;

      // 每次渲染皆重新洗牌打亂順序
      currentOptionChoices.sort(function() { return Math.random() - 0.5; });

      var optionsContainer = document.getElementById('wordOptions');
      optionsContainer.innerHTML = '';

      for (var j = 0; j < currentOptionChoices.length; j++) {
        (function(wordChoice) {
          var row = document.createElement('div');
          row.className = 'word-option-row';

          var btn = document.createElement('button');
          btn.className = 'word-option-btn';
          btn.textContent = wordChoice;
          btn.addEventListener('click', function() {
            forceUnlockAudio();
            checkOption(btn, wordChoice, q.word);
          });

          row.appendChild(btn);

          if (isOptionAudioBtnEnabled) {
            var audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.textContent = '🔊';
            audioBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              forceUnlockAudio();
              speakText(wordChoice);
            });
            row.appendChild(audioBtn);
          }

          optionsContainer.appendChild(row);
        })(currentOptionChoices[j]);
      }
    }

    function selectLetter(btn, char) {
      var targetWord = questions[currentIndex].word;
      if (currentAnswer.length < targetWord.length) {
        currentAnswer.push({ char: char, btnRef: btn });
        btn.classList.add('disabled');
        
        triggerHaptic(15);
        speakText(char);

        var slots = document.querySelectorAll('.slot');
        var activeSlot = slots[currentAnswer.length - 1];
        if (activeSlot) {
          activeSlot.textContent = char;
          activeSlot.classList.add('filled');
        }

        if (currentAnswer.length === targetWord.length) {
          checkSpellingAnswer();
        }
      }
    }

    function removeSlotAt(index) {
      if (index >= 0 && index < currentAnswer.length) {
        var item = currentAnswer[index];
        item.btnRef.classList.remove('disabled');

        var targetWord = questions[currentIndex].word;
        var slots = document.querySelectorAll('.slot');
        
        currentAnswer.splice(index, 1);

        for (var i = 0; i < slots.length; i++) {
          if (i < currentAnswer.length) {
            slots[i].textContent = currentAnswer[i].char;
            slots[i].classList.add('filled');
          } else {
            slots[i].textContent = targetWord[i];
            slots[i].classList.remove('filled');
          }
        }
      }
    }

    function checkSpellingAnswer() {
      var userWord = "";
      for (var i = 0; i < currentAnswer.length; i++) {
        userWord += currentAnswer[i].char;
      }
      var targetWord = questions[currentIndex].word;
      var slotsContainer = document.getElementById('answerSlots');

      if (userWord === targetWord) {
        handleSuccess(targetWord);
      } else {
        wrongAttempts++;
        updateMascot("💪", "再試一次喔！");
        playTone(196.00, 0.3);
        slotsContainer.classList.add('shake');
        triggerHaptic([100, 50, 100]);

        var hintMsg = "開頭字母是 " + targetWord[0] + " 喔！";
        document.getElementById('instructionText').textContent = "💡 提示：" + hintMsg;

        setTimeout(function() {
          speakText("Try again!");
          resetSpellingQuestion();
        }, 600);
      }
    }

    function resetSpellingQuestion() {
      var targetWord = questions[currentIndex].word;
      currentAnswer = [];
      var slotsContainer = document.getElementById('answerSlots');
      slotsContainer.classList.remove('shake');

      var slots = document.querySelectorAll('.slot');
      for (var i = 0; i < slots.length; i++) {
        slots[i].textContent = targetWord[i];
        slots[i].classList.remove('filled');
      }

      var btns = document.querySelectorAll('.letter-btn');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('disabled');
      }
    }

    function checkOption(btn, selectedWord, targetWord) {
      if (isAnswered) return;

      if (selectedWord === targetWord) {
        btn.classList.add('correct');
        handleSuccess(targetWord);
      } else {
        wrongAttempts++;
        btn.classList.add('wrong');
        
        updateMascot("💪", "再試一次喔！");
        playTone(196.00, 0.3);
        triggerHaptic([100, 50, 100]);

        var hintMsg = "這個字的開頭是字母 " + targetWord[0] + " 喔！";
        document.getElementById('instructionText').textContent = "💡 提示：" + hintMsg;
        
        speakText("Try again!");

        // 答錯後短暫顯示紅框，隨後重新隨機打亂所有選項位置！
        setTimeout(function() {
          renderChoiceOptions();
        }, 700);
      }
    }

    function handleSuccess(targetWord) {
      isAnswered = true;
      
      if (wrongAttempts === 0) {
        starsCount += 1;
        document.getElementById('starScore').textContent = starsCount;
      }

      updateMascot("🥳", "Brilliant!");
      triggerMascotBounce();
      triggerConfetti();

      playTone(523.25, 0.15);
      setTimeout(function() { playTone(659.25, 0.25); }, 150);

      triggerHaptic([30, 50, 30]);
      document.getElementById('correctBadge').classList.add('show');

      setTimeout(function() {
        speakText("Brilliant! " + targetWord);
        document.getElementById('nextBtn').style.display = 'inline-block';
      }, 300);
    }

    function loadNextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      initQuestion();
    }

    function playTone(freq, duration) {
      try {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        var ctx = new AudioContext();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(pattern) {
      try {
        if ('vibrate' in navigator) navigator.vibrate(pattern);
      } catch (e) {}
    }

    function speakText(text) {
      try {
        if ('speechSynthesis' in window) {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          window.speechSynthesis.cancel();
          
          var lower = text.toLowerCase();
          var utterance = new SpeechSynthesisUtterance(lower);
          utterance.lang = 'en-GB';
          utterance.rate = speechRate;
          
          var voices = window.speechSynthesis.getVoices();
          var ukVoice = null;
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang === 'en-GB' || voices[i].lang === 'en_GB') {
              ukVoice = voices[i];
              break;
            }
          }
          if (ukVoice) {
            utterance.voice = ukVoice;
          }

          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {}
    }

    function speakCurrentWord() {
      if (questions[currentIndex]) {
        speakText(questions[currentIndex].word);
      }
    }
  </script>
</body>
</html>
